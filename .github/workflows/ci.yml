name: ci

on:
  workflow_dispatch:      # Umożliwia ręczne uruchomienie przyciskiem
  push:                   # Uruchamia się automatycznie po zapisie plików

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Czyszczenie dysku serwera chmurowego
    - name: Cleanup runner
      run: |
        df -h
        sudo rm -rf /opt/microsoft /usr/local/.ghcup /usr/local/julia* /usr/share/dotnet /usr/share/swift /usr/lib/llvm*
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4

    # Wymuszenie konfiguracji dla układu ESP32-S3 N16R8 przed uruchomieniem Dockera
    - name: Configure for ESP32-S3 N16R8
      run: |
        echo "CONFIG_IDF_TARGET=\"esp32s3\"" >> sdkconfig.defaults
        echo "CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=y" >> sdkconfig.defaults
        # Włączenie obsługi 16MB pamięci Flash (N16)
        echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
        echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"" >> sdkconfig.defaults
        # Włączenie i konfiguracja 8MB pamięci Octal PSRAM (R8)
        echo "CONFIG_ESP_SPIRAM=y" >> sdkconfig.defaults
        echo "CONFIG_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
        echo "CONFIG_SPIRAM_SPEED_120M=y" >> sdkconfig.defaults
        # Ustawienie wybranego urządzenia w pliku konfiguracyjnym projektu
        sed -i 's/odroid-go/esp32s3-devkit-c/g' Dockerfile 2>/dev/null || true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: retro-go:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    # Poprawione wyciąganie plików .bin/.img zamiast .fw
    - name: Extract binaries from docker image
      run: |
        mkdir -p build
        docker run --rm -v $(pwd)/build:/build retro-go:latest sh -c "cp /app/build/*.bin /build/ 2>/dev/null || cp /app/build/*.img /build/ 2>/dev/null || cp /app/*.bin /build/ 2>/dev/null || cp -r /app/build/* /build/"

    # Zmiana ścieżki na cały folder build/, aby pobrać pliki instalacyjne dla S3
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: build/
