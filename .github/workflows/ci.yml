name: ci

on:
  workflow_dispatch:      # Umożliwia ręczne uruchomienie przyciskiem
  push:                   # Uruchamia się automatycznie po zapisie plików

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Czyszczenie dysku serwera chmurowego
    - name: Cleanup runner
      run: |
        df -h
        sudo rm -rf /opt/microsoft /usr/local/.ghcup /usr/local/julia* /usr/share/dotnet /usr/share/swift /usr/lib/llvm*
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4

    # Wymuszenie konfiguracji sprzętowej specjalnie dla wersji N16R8 (16MB Flash, 8MB Octal PSRAM)
    - name: Configure for ESP32-S3 N16R8
      run: |
        echo "CONFIG_IDF_TARGET=\"esp32s3\"" >> sdkconfig.defaults
        echo "CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=y" >> sdkconfig.defaults
        # Włączenie obsługi 16MB pamięci Flash (N16)
        echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
        echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"" >> sdkconfig.defaults
        # Włączenie i konfiguracja 8MB pamięci Octal PSRAM (R8)
        echo "CONFIG_ESP_SPIRAM=y" >> sdkconfig.defaults
        echo "CONFIG_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
        echo "CONFIG_SPIRAM_SPEED_120M=y" >> sdkconfig.defaults
        # Naprawa nazwy urządzenia w skrypcie budującym (Dockerfile)
        if [ -f Dockerfile ]; then
          sed -i 's/esp32s3-devkit-c/esp32-s3-devkit/g' Dockerfile
          sed -i 's/odroid-go/esp32-s3-devkit/g' Dockerfile
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: retro-go:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    # Wyciąganie skompilowanych plików binarnych (.bin i .img)
    - name: Extract binaries from docker image
      run: |
        mkdir -p build
        docker run --rm -v $(pwd)/build:/build retro-go:latest sh -c "cp -r /app/build/* /build/ 2>/dev/null || cp /app/*.bin /build/ 2>/dev/null || cp /app/*.img /build/ 2>/dev/null"

    # Wrzucenie gotowej paczki do pobrania
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: build/
